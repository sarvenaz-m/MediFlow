name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Verify and build Android
        run: >-
          bash gradlew --no-daemon
          :core:model:test :core:data:testDebugUnitTest
          :core:reminders:testDebugUnitTest :app:testDebugUnitTest
          :app:lintDebug :app:assembleDebug :app:assembleBenchmark
          :benchmarks:assembleBenchmark

  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: git diff --exit-code -- index.html
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
